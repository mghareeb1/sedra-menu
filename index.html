<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو عطارة سدرة - دمنهور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6E8B68;
            --primary-dark: #556F4F;
            --primary-light: #A2B997;
            --bg-light: #F7F9F6;
            --surface: #FFFFFF;
            --text-main: #20301B;
            --text-muted: #64748b;
            --border: #E2E8F0;
            --danger: #ef4444;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            padding-bottom: 100px;
        }

        /* الهيدر واللوجو */
        header {
            background: var(--surface);
            padding: 20px 15px;
            text-align: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            max-height: 85px;
            width: auto;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .store-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* أدوات التصفية والبحث */
        .controls-container {
            max-width: 800px;
            margin: 15px auto;
            padding: 0 15px;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: var(--surface);
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--primary);
        }

        .categories-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 0 5px;
            scrollbar-width: none;
        }

        .categories-bar::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .cat-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* شبكة المنتجات */
        .products-grid {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            margin-bottom: 12px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .product-cat {
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
        }

        .weight-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .weight-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-light);
            padding: 8px 12px;
            border-radius: 10px;
        }

        .weight-info {
            display: flex;
            flex-direction: column;
        }

        .weight-label {
            font-size: 13px;
            font-weight: 700;
        }

        .weight-price {
            font-size: 12px;
            color: var(--primary-dark);
            font-weight: 700;
        }

        .btn-add {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background: var(--primary-dark);
        }

        /* شريط السلة العائم */
        .floating-cart {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 600px;
            background: var(--primary);
            color: #fff;
            padding: 14px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(110, 139, 104, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            z-index: 200;
            transition: transform 0.2s;
        }

        .floating-cart.hidden {
            display: none;
        }

        .cart-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 700;
        }

        .cart-badge {
            background: #fff;
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 12px;
        }

        /* نافذة السلة (Modal) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-end;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 800;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-items-list {
            overflow-y: auto;
            flex-grow: 1;
            margin-bottom: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .item-meta {
            display: flex;
            flex-direction: column;
        }

        .item-name {
            font-weight: 700;
            font-size: 14px;
        }

        .item-sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: var(--bg-light);
            border: 1px solid var(--border);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 5px;
        }

        .loading-text {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            font-weight: 700;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="عطارة سدرة" class="logo">
        <div class="store-subtitle">دمنهور - جودة وأصالة العطارة والزيوت</div>
    </header>

    <div class="controls-container">
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن بهارات، أعشاب، زيوت...">
        <div class="categories-bar" id="categoriesBar">
            <button class="cat-btn active" data-cat="الكل">الكل</button>
        </div>
    </div>

    <div class="products-grid" id="productsGrid">
        <div class="loading-text">جاري تحميل الأصناف...</div>
    </div>

    <!-- شريط السلة العائم -->
    <div class="floating-cart hidden" id="floatingCart" onclick="openCartModal()">
        <div class="cart-info">
            <span class="cart-badge" id="cartCount">0</span>
            <span>عرض السلة</span>
        </div>
        <div class="cart-total" id="cartTotalText">0.00 ج.م</div>
    </div>

    <!-- نافذة تأكيد الطلب -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">سلة المشتريات</div>
                <button class="close-btn" onclick="closeCartModal()">&times;</button>
            </div>
            
            <div class="cart-items-list" id="cartItemsList"></div>

            <div class="input-group">
                <input type="text" id="custName" class="form-input" placeholder="اسم العميل (مطلوب)">
            </div>
            <div class="input-group">
                <input type="text" id="custAddress" class="form-input" placeholder="العنوان بالتفصيل أو الاستلام من الفرع">
            </div>

            <button class="btn-whatsapp" onclick="sendOrderToWhatsApp()">
                تأكيد الطلب عبر واتساب
            </button>
        </div>
    </div>

    <script>
        // ================= الإعدادات الرئيسية =================
        // 1. ضع رابط الـ CSV لشيت جوجل المنشور هنا:
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQPJpomiCNYAOfbO8irtihdoA2uDeJ4JNn94tG3UJGc1QSdGpQFUr555VZqk4mOj7tla6jP4yWSUUvV/pub?output=csv";
        
        // 2. رقم واتساب عطارة سدرة مع كود الدولة (بدون + أو مسافات):
        const WHATSAPP_PHONE = "201044760160";
        // =====================================================

        let products = [];
        let cart = {};
        let activeCategory = "الكل";

        // تحليل ملف CSV
        function parseCSV(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            const headers = lines[0].split(',').map(h => h.trim());
            
            return lines.slice(1).map(line => {
                const values = line.split(',').map(v => v.trim());
                return {
                    name: values[0] || '',
                    category: values[1] || 'أخرى',
                    price50: parseFloat(values[2]) || 0,
                    price125: parseFloat(values[3]) || 0,
                    available: (values[4] || 'متاح').includes('متاح')
                };
            }).filter(p => p.name && p.available);
        }

        // جلب البيانات من الشيت
        async function fetchProducts() {
            try {
                const res = await fetch(GOOGLE_SHEET_CSV_URL);
                if (!res.ok) throw new Error("تعذر جلب البيانات");
                const text = await res.text();
                products = parseCSV(text);
                renderCategories();
                renderProducts();
            } catch (err) {
                // بيانات تجريبية في حال لم يتم الربط بالشيت بعد
                products = [
                    { name: "كمون بلدي فاخر", category: "بهارات", price50: 15, price125: 35, available: true },
                    { name: "فلفل أسود برازيلي", category: "بهارات", price50: 25, price125: 60, available: true },
                    { name: "ينسون نجمي طبيعي", category: "أعشاب", price50: 30, price125: 70, available: true },
                    { name: "زيت حبة البركة معصور ع البارد", category: "زيوت", price50: 45, price125: 110, available: true },
                    { name: "كركم هندي أصلي", category: "بهارات", price50: 15, price125: 35, available: true }
                ];
                renderCategories();
                renderProducts();
            }
        }

        // بناء التصنيفات
        function renderCategories() {
            const categories = ["الكل", ...new Set(products.map(p => p.category))];
            const container = document.getElementById('categoriesBar');
            container.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>
            `).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderProducts();
        }

        // عرض المنتجات
        function renderProducts() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const grid = document.getElementById('productsGrid');

            const filtered = products.filter(p => {
                const matchCat = activeCategory === "الكل" || p.category === activeCategory;
                const matchSearch = p.name.toLowerCase().includes(query);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="loading-text">لا توجد نتائج مطابقة</div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="card">
                    <div class="card-header">
                        <div class="product-title">${p.name}</div>
                        <div class="product-cat">${p.category}</div>
                    </div>
                    <div class="weight-options">
                        <div class="weight-row">
                            <div class="weight-info">
                                <span class="weight-label">وزن 50 جرام</span>
                                <span class="weight-price">${p.price50} ج.م</span>
                            </div>
                            <button class="btn-add" onclick="addToCart('${p.name}', '50 جرام', ${p.price50})">+ أضف</button>
                        </div>
                        <div class="weight-row">
                            <div class="weight-info">
                                <span class="weight-label">وزن 125 جرام (تمن)</span>
                                <span class="weight-price">${p.price125} ج.م</span>
                            </div>
                            <button class="btn-add" onclick="addToCart('${p.name}', '125 جرام', ${p.price125})">+ أضف</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // إدارة السلة
        function addToCart(name, weight, price) {
            const key = `${name} (${weight})`;
            if (!cart[key]) {
                cart[key] = { name, weight, price, qty: 1 };
            } else {
                cart[key].qty++;
            }
            updateCartUI();
        }

        function changeQty(key, delta) {
            if (cart[key]) {
                cart[key].qty += delta;
                if (cart[key].qty <= 0) delete cart[key];
                updateCartUI();
                renderCartModal();
            }
        }

        function updateCartUI() {
            const keys = Object.keys(cart);
            let totalItems = 0;
            let totalPrice = 0;

            keys.forEach(k => {
                totalItems += cart[k].qty;
                totalPrice += (cart[k].qty * cart[k].price);
            });

            const floating = document.getElementById('floatingCart');
            if (totalItems > 0) {
                floating.classList.remove('hidden');
                document.getElementById('cartCount').innerText = `${totalItems} صنف`;
                document.getElementById('cartTotalText').innerText = `${totalPrice.toFixed(2)} ج.م`;
            } else {
                floating.classList.add('hidden');
                closeCartModal();
            }
        }

        // السلة المنبثقة
        function openCartModal() {
            renderCartModal();
            document.getElementById('cartModal').classList.add('active');
        }

        function closeCartModal() {
            document.getElementById('cartModal').classList.remove('active');
        }

        function renderCartModal() {
            const list = document.getElementById('cartItemsList');
            const keys = Object.keys(cart);
            let totalPrice = 0;

            if (keys.length === 0) {
                list.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted);">السلة فارغة</div>`;
                return;
            }

            list.innerHTML = keys.map(k => {
                const item = cart[k];
                const lineTotal = item.qty * item.price;
                totalPrice += lineTotal;
                return `
                    <div class="cart-item">
                        <div class="item-meta">
                            <span class="item-name">${item.name}</span>
                            <span class="item-sub">${item.weight} - ${item.price} ج.م</span>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty('${k}', -1)">-</button>
                            <span style="font-weight:700; min-width:20px; text-align:center;">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty('${k}', 1)">+</button>
                            <span style="font-weight:700; margin-right:8px; font-size:13px;">${lineTotal} ج.م</span>
                        </div>
                    </div>
                `;
            }).join('') + `
                <div style="display:flex; justify-content:space-between; font-weight:800; padding:15px 0; font-size:16px;">
                    <span>الإجمالي الكلي:</span>
                    <span style="color:var(--primary);">${totalPrice.toFixed(2)} ج.م</span>
                </div>
            `;
        }

        // التحويل للواتساب
        function sendOrderToWhatsApp() {
            const name = document.getElementById('custName').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const keys = Object.keys(cart);

            if (!name) {
                alert("يرجى إدخال اسم العميل أولاً.");
                return;
            }

            if (keys.length === 0) {
                alert("السلة فارغة!");
                return;
            }

            let msg = `*طلب أوردر جديد من منيو عطارة سدرة 🌿*\n`;
            msg += `------------------------------------\n`;
            msg += `👤 *العميل:* ${name}\n`;
            msg += `📍 *العنوان:* ${address || 'استلام من الفرع'}\n`;
            msg += `------------------------------------\n`;
            msg += `*الطلبات والأصناف:*\n`;

            let grandTotal = 0;
            keys.forEach((k, idx) => {
                const item = cart[k];
                const sub = item.qty * item.price;
                grandTotal += sub;
                msg += `${idx + 1}. ${item.name} (${item.weight}) × ${item.qty} = ${sub} ج.م\n`;
            });

            msg += `------------------------------------\n`;
            msg += `💰 *الإجمالي الكلي:* ${grandTotal.toFixed(2)} ج.م\n`;

            const url = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        document.getElementById('searchInput').addEventListener('input', renderProducts);
        fetchProducts();
    </script>
</body>
</html>
